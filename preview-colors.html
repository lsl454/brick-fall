<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>宝石配色预览 · Gem Collapse</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  min-height:100%; background:#100c0e; color:#ece7e0;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body { display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; }
h1 { font-size:20px; margin-bottom:6px; letter-spacing:2px; color:#ffb340; }
p.sub { font-size:12px; color:#7e7770; margin-bottom:20px; }
.board {
  background:#0c0b11; border:1px solid rgba(217,194,149,.22);
  border-radius:10px; padding:14px; display:grid; gap:10px;
  grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); width:100%; max-width:720px;
  box-shadow:0 0 50px rgba(0,0,0,.8);
}
.sw { display:flex; flex-direction:column; align-items:center; gap:8px; }
.lbl { font-size:12px; color:#b9b2a8; font-weight:600; }
.hex { font-size:10px; color:#6f6350; font-family:Consolas,monospace; }
.note { margin-top:18px; font-size:11px; color:#6f6350; max-width:720px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <h1>◆ 宝石坍缩 · 绚丽配色 ◆</h1>
  <p class="sub">高饱和多彩珠宝色 · 预览全部 7 种宝石砖</p>
  <div class="board" id="board"></div>
  <p class="note">每种宝石预生成 4 个随机变体（上图每格只取其一）。此页面仅用于快速确认配色；完整可玩版请双击 <b>preview-single-file.html</b>。</p>

<script>
(function(){
  const PALETTE = {
    I: { core:"#1fd7ff", shell:"#062831", light:"#c8f4ff", name:"电光青" },
    O: { core:"#b06cff", shell:"#200f3d", light:"#e6d2ff", name:"亮紫晶" },
    T: { core:"#ff4fa8", shell:"#3a0b26", light:"#ffd0e8", name:"蔷薇红" },
    S: { core:"#2fe39b", shell:"#043628", light:"#c6ffea", name:"翡翠绿" },
    Z: { core:"#ff6b4d", shell:"#3a0f06", light:"#ffd2c2", name:"珊瑚橙" },
    J: { core:"#4f8dff", shell:"#0a1b3d", light:"#d4e1ff", name:"宝石蓝" },
    L: { core:"#ffb340", shell:"#38250a", light:"#ffe9c4", name:"琥珀金" }
  };
  const SIZE = 110, SS = 3;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function hexToRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function f(v,amt){return amt>=0?v+(255-v)*amt:v*(1+amt);}
  function shade(hex,amt){const [r,g,b]=hexToRgb(hex);return `rgb(${f(r,amt)|0},${f(g,amt)|0},${f(b,amt)|0})`;}
  function shadeA(hex,amt,a){const [r,g,b]=hexToRgb(hex);return `rgba(${f(r,amt)|0},${f(g,amt)|0},${f(b,amt)|0},${a})`;}
  function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}

  function make(core,light,shell,seed){
    const S = SIZE*SS, cv=document.createElement("canvas"); cv.width=S; cv.height=S;
    const g=cv.getContext("2d"); const rnd=mulberry32(seed*7919+13);
    const gap=1.6*SS, O=gap, L=S-gap*2, R=L*0.24;
    g.save(); g.shadowColor="rgba(0,0,0,.5)"; g.shadowBlur=4*SS; g.shadowOffsetY=2.2*SS;
    rr(O,O,L,L,R); g.fillStyle=shade(shell,-0.3); g.fill(); g.restore();
    rr(O,O,L,L,R);
    const shellG=g.createLinearGradient(0,O,0,O+L);
    shellG.addColorStop(0,shade(shell,0.24)); shellG.addColorStop(0.5,shade(shell,0.02)); shellG.addColorStop(1,shade(shell,-0.20));
    g.fillStyle=shellG; g.fill();
    const bw=2.0*SS, fx=O+bw, fy=O+bw, fw=L-bw*2, fh=L-bw*2, fr=R-bw*0.6;
    const body=g.createLinearGradient(0,fy,0,fy+fh);
    body.addColorStop(0,shade(light,0.10)); body.addColorStop(0.28,core); body.addColorStop(0.62,shade(core,-0.12)); body.addColorStop(0.85,shade(core,-0.32)); body.addColorStop(1,shade(core,-0.52));
    rr(fx,fy,fw,fh,fr); g.fillStyle=body; g.fill();
    g.save(); rr(fx,fy,fw,fh,fr); g.clip();
    const fire=g.createRadialGradient(fx+fw*0.5,fy+fh*0.62,0,fx+fw*0.5,fy+fh*0.62,fh*0.78);
    fire.addColorStop(0,shadeA(light,0.06,0.55)); fire.addColorStop(0.5,shadeA(light,0.06,0.14)); fire.addColorStop(1,shadeA(light,0.06,0));
    g.fillStyle=fire; g.fillRect(fx,fy,fw,fh);
    const spec=g.createRadialGradient(fx+fw*0.30,fy+fh*0.22,0,fx+fw*0.30,fy+fh*0.22,fw*0.60);
    spec.addColorStop(0,"rgba(255,255,255,.55)"); spec.addColorStop(0.35,"rgba(255,255,255,.16)"); spec.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle=spec; g.fillRect(fx,fy,fw,fh);
    g.strokeStyle="rgba(255,255,255,.15)"; g.lineWidth=0.9*SS;
    for(let i=1;i<=3;i++){const t=i/4,y1=fy+t*fh,y2=fy+Math.min(1,t+0.32)*fh;if(y2>fy+fh)break;g.beginPath();g.moveTo(fx,y1);g.lineTo(fx+fw,y2);g.stroke();}
    for(let i=1;i<=3;i++){const t=i/4,y1=fy+t*fh,y2=fy+Math.min(1,t+0.32)*fh;if(y2>fy+fh)break;g.beginPath();g.moveTo(fx+fw,y1);g.lineTo(fx,y2);g.stroke();}
    const bounce=g.createLinearGradient(0,fy+fh,0,fy+fh*0.60);
    bounce.addColorStop(0,shadeA(light,0,0.34)); bounce.addColorStop(1,shadeA(light,0,0));
    g.fillStyle=bounce; g.fillRect(fx,fy,fw,fh);
    for(let i=0;i<18;i++){ g.fillStyle=rnd()>0.5?"rgba(255,255,255,.05)":"rgba(0,0,0,.06)"; g.fillRect(fx+rnd()*fw,fy+rnd()*fh,rnd()*2.2*SS+0.6,rnd()*1.8*SS+0.6); }
    g.restore();
    g.save(); rr(fx,fy,fw,fh,fr); g.clip();
    g.strokeStyle="rgba(255,255,255,.6)"; g.lineWidth=1.5*SS; g.beginPath(); g.moveTo(fx+fr*0.5,fy+0.7*SS); g.lineTo(fx+fw-fr*0.5,fy+0.7*SS); g.stroke();
    g.strokeStyle="rgba(0,0,0,.30)"; g.lineWidth=1.6*SS; g.beginPath(); g.moveTo(fx+fr*0.5,fy+fh-0.8*SS); g.lineTo(fx+fw-fr*0.5,fy+fh-0.8*SS); g.stroke();
    g.restore();
    rr(O+0.5*SS,O+0.5*SS,L-SS,L-SS,R); g.strokeStyle="rgba(0,0,0,.5)"; g.lineWidth=1.1*SS; g.stroke();
    rr(fx,fy,fw,fh,fr); g.strokeStyle=shadeA(light,0.05,0.40); g.lineWidth=1.0*SS; g.stroke();
    return cv;
  }

  const board=document.getElementById("board");
  for(const k in PALETTE){
    const p=PALETTE[k];
    const cv=make(p.core,p.light,p.shell,2);
    cv.style.width="100%"; cv.style.height=SIZE+"px"; cv.style.borderRadius="8px";
    const div=document.createElement("div"); div.className="sw";
    const cell=document.createElement("div"); cell.appendChild(cv);
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=p.name;
    const hex=document.createElement("div"); hex.className="hex"; hex.textContent=p.core;
    div.appendChild(cell); div.appendChild(lbl); div.appendChild(hex);
    board.appendChild(div);
  }
})();
</script>
</body>
</html>
