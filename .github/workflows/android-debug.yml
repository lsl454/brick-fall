name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 平台
        run: npx cap add android

      - name: 锁定竖屏
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $MANIFEST || true
          grep -n screenOrientation $MANIFEST || echo "未匹配到 activity 标签，跳过竖屏锁定"

      - name: 同步 web 资源
        run: npx cap sync android

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: brick-fall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
